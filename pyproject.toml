[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smellai"
version = "0.1.0"
description = "LLM-based code smell detection and refactoring experiments"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "deeplake<4.0.0",
    "defusedxml>=0.7.1",
    "GitPython>=3.1.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.2.0",
    "litellm>=1.0.0",
    "matplotlib>=3.8.0",
    "mlflow[mcp]>=3.5.1",
    "mysql-connector-python>=9.0.0",
    "networkx>=3.0.0",
    "orjson>=3.11.5",
    "pandas>=2.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "langchain-litellm>=0.3.5",
    "sqlmodel>=0.0.22",
    "pyarrow>=15.0.0",
    "fire>=0.7.1",
    "py2neo>=2021.2.4",
    "typer>=0.23.1",
    "typer-config>=1.5.1",
    "langchain-mcp-adapters>=0.1.13",
    "javalang>=0.13.0",
    "httpx>=0.28.1",
    "tenacity>=9.1.2",
]

[project.scripts]
smellai-mlflow = "mlflow_utils.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agents", "code_analysis", "models", "repo_utils", "rminer", "sonarqube", "mlflow_utils", "smellai_datasets"]

[tool.uv.sources]

[dependency-groups]
ablation = [
    "mini-swe-agent>=2.2.8",
]
dev = [
    "autoflake>=2.3.1",
    "autopep8>=2.3.2",
    "isort>=7.0.0",
    "ipython>=8.20.0",
    "marimo>=0.23.1",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
    "types-defusedxml>=0.7.0",
    "importlab>=0.8.1",
    "hypothesis>=6.152.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    'ignore:Support for class-based `config` is deprecated, use ConfigDict instead\.:pydantic.warnings.PydanticDeprecatedSince20',
]

[[tool.uv.index]]
name = "pypi"
default = true
url = "https://pypi.org/simple"
